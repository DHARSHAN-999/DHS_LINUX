services:
  web:
    image: nginx:latest
    container_name: dhas-web-servr
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - .:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    restart: always

  web2:
    image: nginx:alpine
    container_name: dhas-web-servr-2
    ports:
      - "8081:80"
    volumes:
      - ./web.html:/usr/share/nginx/html/index.html:ro
    restart: always

  redis:
    image: redis:alpine
    container_name: my-cache
